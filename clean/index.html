<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instrucciones de Limpieza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#26547C; --navy-dark:#1A3C59;
    --teal:#06D6A0; --teal-dark:#027E5A; --teal-tint:#9AEBDA;
    --amber:#FFD166; --amber-dark:#8A6800; --amber-mid:#E8A000; --amber-tint:#FFE59A;
    --pink:#EF476F; --pink-tint:#FDECEF; --pink-mid:#F5B3C0;
    --bg:#EEF4F9; --card:#FFFFFF; --cream:#FFF8E6;
    --ink:#1F2D3D; --ink-soft:#5A6B7C;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Roboto',sans-serif; line-height:1.5;
    padding-bottom:4rem;
  }
  header{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-dark) 100%);
    color:#fff; padding:3rem 1.5rem 2.5rem; text-align:center; position:relative;
  }
  .lang-switch{
    position:absolute; top:1rem; right:1rem; display:flex; gap:.35rem;
    background:rgba(255,255,255,.1); padding:.3rem; border-radius:999px;
  }
  .lang-switch button{
    border:none; background:transparent; color:#C9DCEE; font-weight:700; font-size:.8rem;
    padding:.35rem .7rem; border-radius:999px; cursor:pointer; font-family:'Roboto',sans-serif;
  }
  .lang-switch button.active{background:var(--teal); color:var(--navy-dark);}
  header h1{margin:0 0 .4rem; font-size:1.9rem; font-weight:900; letter-spacing:-.01em;}
  header .subtitle{color:var(--teal-tint); font-weight:500; font-size:1.05rem;}
  header .tagline{margin-top:1rem; font-size:.85rem; color:#C9DCEE; max-width:38rem; margin-inline:auto;}
  header .disclaimer{
    margin-top:.9rem; font-size:.8rem; color:var(--navy-dark); background:var(--amber-tint);
    border-radius:10px; padding:.6rem 1rem; max-width:34rem; margin-inline:auto; font-weight:500;
  }

  main{max-width:840px; margin:0 auto; padding:0 1.25rem;}

  nav.toc{
    display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center;
    margin:-1.6rem auto 2.5rem; position:relative; z-index:2;
  }
  nav.toc a{
    background:var(--card); color:var(--navy); text-decoration:none;
    font-weight:700; font-size:.85rem; padding:.6rem 1rem; border-radius:999px;
    box-shadow:0 4px 14px rgba(26,60,89,.15); display:flex; align-items:center; gap:.4rem;
    border:1px solid rgba(38,84,124,.08);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  nav.toc a:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(26,60,89,.22);}
  nav.toc svg{width:16px; height:16px; flex:none;}

  section.room{
    background:var(--card); border-radius:var(--radius); margin-bottom:1.75rem;
    box-shadow:0 2px 10px rgba(26,60,89,.08); overflow:hidden;
    scroll-margin-top:1rem;
  }
  .room-head{
    display:flex; align-items:center; gap:.9rem; padding:1.25rem 1.5rem;
    background:var(--cream); border-bottom:3px solid var(--amber);
  }
  .room-head .icon{
    width:44px; height:44px; flex:none; border-radius:12px; background:var(--navy);
    display:flex; align-items:center; justify-content:center;
  }
  .room-head .icon svg{width:24px; height:24px; stroke:#fff;}
  .room-head h2{margin:0; font-size:1.3rem; color:var(--navy-dark); font-weight:900;}

  .room-body{padding:1.25rem 1.5rem 1.75rem;}

  h3.sub{
    font-size:1rem; color:var(--teal-dark); font-weight:700; margin:1.4rem 0 .3rem;
    display:flex; align-items:center; gap:.5rem;
  }
  h3.sub:first-child{margin-top:0;}
  h3.sub::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--teal); flex:none;}

  ol{margin:.4rem 0 0; padding-left:1.3rem;}
  ol li{margin-bottom:.5rem; padding-left:.2rem;}
  ol li::marker{font-weight:700; color:var(--navy);}
  strong{color:var(--navy-dark);}

  .warn{
    display:flex; gap:.8rem; align-items:flex-start; margin-top:1rem;
    background:var(--pink-tint); border:1px solid var(--pink-mid);
    border-radius:10px; padding:.9rem 1.1rem; font-size:.92rem;
  }
  .warn svg{width:20px; height:20px; flex:none; stroke:var(--pink); margin-top:.15rem;}
  .warn strong{color:var(--pink);}

  .divider{height:1px; background:linear-gradient(90deg,transparent,rgba(38,84,124,.15),transparent); margin:.2rem 0 1.2rem;}

  /* product photo cards */
  .product-row{display:flex; flex-wrap:wrap; gap:1rem; margin:.9rem 0 1.2rem;}
  .product-card{
    flex:1 1 160px; max-width:200px; background:var(--bg); border-radius:12px;
    padding:.7rem; text-align:center; border:1px solid rgba(38,84,124,.08);
  }
  .product-card img{
    width:100%; height:120px; object-fit:contain; border-radius:8px; background:#fff;
    display:block; margin-bottom:.5rem;
  }
  .product-card figcaption{font-size:.75rem; color:var(--ink-soft); line-height:1.35;}

  /* order of importance */
  .priority{
    background:linear-gradient(135deg,var(--navy-dark),var(--navy));
    border-radius:var(--radius); color:#fff; padding:2rem 1.5rem; margin-top:2.5rem;
    text-align:center;
  }
  .priority h2{margin:0 0 .4rem; font-size:1.2rem; font-weight:900;}
  .priority-note{margin:0 0 1.4rem; font-size:.85rem; color:#C9DCEE;}
  .priority-chain{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:.5rem;
  }
  .priority-chain .chip{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.25);
    padding:.6rem 1.1rem; border-radius:999px; font-weight:700; font-size:.95rem;
  }
  .priority-chain .chip.p1{background:var(--pink); border-color:var(--pink);}
  .priority-chain .arrow{color:var(--amber); font-size:1.3rem; font-weight:900;}

  footer{max-width:840px; margin:2.5rem auto 0; padding:0 1.25rem; text-align:center; color:var(--ink-soft); font-size:.8rem;}
  footer #t-contact{font-size:.9rem; color:var(--navy); font-weight:500; margin-bottom:.6rem;}

  @media (max-width:520px){
    header h1{font-size:1.5rem;}
    .lang-switch{position:static; justify-content:center; margin-bottom:1rem; display:inline-flex;}
    .room-head{padding:1rem 1.1rem;}
    .room-body{padding:1rem 1.1rem 1.4rem;}
    .priority-chain{gap:.35rem;}
    .priority-chain .arrow{display:none;}
    .product-card{max-width:none; flex:1 1 45%;}
  }
</style>
</head>
<body>

function li(items){ return items.map(s => `<li>${s}</li>`).join(""); }

function render(lang){
  const t = T[lang];
  document.title = t.headerTitle;
  document.documentElement.lang = lang;
  document.getElementById("t-header-title").textContent = t.headerTitle;
  document.getElementById("t-header-subtitle").textContent = t.headerSubtitle;
  document.getElementById("t-header-tagline").textContent = t.headerTagline;
  document.getElementById("t-disclaimer").textContent = t.disclaimer;
  document.getElementById("t-nav-bathroom").textContent = t.navBathroom;
  document.getElementById("t-nav-kitchen").textContent = t.navKitchen;
  document.getElementById("t-nav-toilets").textContent = t.navToilets;
  document.getElementById("t-nav-windows").textContent = t.navWindows;

  document.getElementById("t-bathroom-title").textContent = t.bathroomTitle;
  document.getElementById("t-bath-sub").textContent = t.bathSub;
  document.getElementById("t-bath-steps").innerHTML = li(t.bathSteps);
  document.getElementById("t-surroundings-sub").textContent = t.surroundingsSub;
  document.getElementById("t-surroundings-steps").innerHTML = li(t.surroundingsSteps);
  document.getElementById("t-mirrors-sub").textContent = t.mirrorsSub;
  document.getElementById("t-mirrors-steps").innerHTML = li(t.mirrorsSteps);
  document.getElementById("t-shower-sub").textContent = t.showerSub;
  document.getElementById("t-shower-steps").innerHTML = li(t.showerSteps);

  document.getElementById("t-kitchen-title").textContent = t.kitchenTitle;
  document.getElementById("t-sink-sub").textContent = t.sinkSub;
  document.getElementById("t-sink-steps").innerHTML = li(t.sinkSteps);
  document.getElementById("t-warning").innerHTML = t.warning;
  document.getElementById("t-countertop-sub").textContent = t.countertopSub;
  document.getElementById("t-caption-stonetop").textContent = t.captionStonetop;
  document.getElementById("t-countertop-steps").innerHTML = li(t.countertopSteps);
  document.getElementById("t-furniture-sub").textContent = t.furnitureSub;
  document.getElementById("t-furniture-steps").innerHTML = li(t.furnitureSteps);

  document.getElementById("t-toilets-title").textContent = t.toiletsTitle;
  document.getElementById("t-toilets-steps").innerHTML = li(t.toiletsSteps);

  document.getElementById("t-windows-title").textContent = t.windowsTitle;
  document.getElementById("t-windows-note").innerHTML = t.windowsNote;
  document.getElementById("t-general-sub").textContent = t.generalSub;
  document.getElementById("t-caption-vacuum").textContent = t.captionVacuum;
  document.getElementById("t-caption-mop").textContent = t.captionMop;
  document.getElementById("t-general-steps").innerHTML = li(t.generalSteps);
  document.getElementById("t-applyto-intro").textContent = t.applytoIntro;
  document.getElementById("t-applyto-list").innerHTML = li(t.applytoList);
  document.getElementById("t-livingroom-sub").textContent = t.livingroomSub;
  document.getElementById("t-livingroom-steps").innerHTML = li(t.livingroomSteps);

  document.getElementById("t-priority-title").textContent = t.priorityTitle;
  document.getElementById("t-priority-note").textContent = t.priorityNote;
  document.getElementById("t-priority-chain").innerHTML = t.priorityChain.map((c,i) =>
    (i>0 ? `<span class="arrow">→</span>` : "") + `<span class="chip${i===0?" p1":""}">${c}</span>`
  ).join("");

  document.getElementById("t-contact").textContent = t.contact;

  document.querySelectorAll(".lang-switch button").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
  localStorage.setItem("clean-lang", lang);
}

document.querySelectorAll(".lang-switch button").forEach(b => b.addEventListener("click", () => render(b.dataset.lang)));
render(localStorage.getItem("clean-lang") || "es");
</script>
